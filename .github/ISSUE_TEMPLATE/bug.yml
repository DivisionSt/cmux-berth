name: Bug report
description: Something cmux-berth did that it should not have.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How can I make it happen?
      description: The commands you ran, and your config file if you have one (remove anything private).
    validations:
      required: true
  - type: input
    id: release
    attributes:
      label: Which release or commit are you running?
      placeholder: v0.1.0
    validations:
      required: true
  - type: textarea
    id: versions
    attributes:
      label: Versions
      description: "Your OS, and the output of: bash --version | head -1; jq --version; fzf --version; cmux --version"
      render: text
    validations:
      required: true
